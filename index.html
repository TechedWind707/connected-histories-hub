/* ---------- Featured carousel ----------------------------------------
   All slides sit in the SAME grid cell, so the carousel is always as tall
   as its tallest slide: no fixed height, nothing gets cut off. Layout
   switches on the carousel's own width (container query), not the
   window's, which is why opening DevTools no longer changes it.        */
function mountCarousel() {
  const el = $('#carousel'); if (!el) return;
  const items = FEATURED.filter(f => node(f.id) && recsOf(f.id).length);  // see the image check below
  let i = 0, timer = 0;
  el.innerHTML = `<div class="car-track">${items.map((feat, k) => {
    let f = feat;
    const n = node(f.id), recs = recsOf(f.id), st = (n.statements || [])[0];
    // only show a picture that really belongs to this entity, and describe THAT record
    const imgRec = f.imgRecord && recs.find(r => r.id === f.imgRecord);
    if (!imgRec) f = { ...f, img: '' };
    const quote = st ? (st[0].length > 240 ? st[0].slice(0, 238).replace(/\s+\S*$/, '') + '…' : st[0]) : '';
    return `<a class="slide ${k === 0 ? 'on' : ''} ${f.img ? 'with-img' : 'with-list'}" href="${href('e/' + f.id)}" aria-hidden="${k !== 0}" ${k !== 0 ? 'tabindex="-1"' : ''}>
      <div class="slide-text">
        <p class="meta">${h(f.kicker)}</p>
        <h3>${h(n.name)}</h3>
        ${quote ? `<p class="slide-quote">“${h(quote)}”</p><p class="meta">${h(st[1])}</p>` : `<p class="slide-quote">${h((imgRec || recs[0]).title)}</p><p class="meta">${h((imgRec || recs[0]).dateText || 'Date not recorded')} · ${h(instName((imgRec || recs[0]).holder))}</p>`}
        <p class="slide-foot">${plural(recs.length, 'record')} from ${plural(new Set(recs.map(r => r.holder)).size, 'institution')} <span class="slide-go">Explore</span></p>
      </div>
      ${!f.img ? `<div class="slide-list"><p class="meta">In the records</p><ul>${[...new Map(recs.filter(r => r.dateStart != null).concat(recs).map(r => [r.title, r])).values()].slice(0, 3).map(r => `<li>${h(r.title)}<span class="meta">${h(r.dateText || 'Date not recorded')} · ${h(instName(r.holder))}</span></li>`).join('')}</ul></div>` : ''}
      ${f.img ? `<figure class="slide-fig"><img src="${h(f.img)}" alt="" loading="lazy" onerror="this.closest('.slide').classList.remove('with-img');this.parentNode.remove()"><figcaption>${h(f.imgCredit)}</figcaption></figure>` : ''}
    </a>`;
  }).join('')}</div>
  <div class="car-ctl"><button class="btn btn-quiet" data-d="-1" aria-label="Previous">Previous</button>
    <span class="car-dots">${items.map((_, k) => `<button class="dot ${k === 0 ? 'on' : ''}" data-k="${k}" aria-label="Show ${h(node(items[k].id).name)}"></button>`).join('')}</span>
    <button class="btn btn-quiet" data-d="1" aria-label="Next">Next</button></div>`;
  const show = k => {
    i = (k + items.length) % items.length;
    $$('.slide', el).forEach((s, j) => { s.classList.toggle('on', j === i); s.setAttribute('aria-hidden', j !== i); s.tabIndex = j === i ? 0 : -1; });
    $$('.dot', el).forEach((d, j) => d.classList.toggle('on', j === i));
  };
  $$('.car-ctl button', el).forEach(b => b.onclick = () => { show(b.dataset.k != null ? +b.dataset.k : i + +b.dataset.d); restart(); });
  const restart = () => { clearInterval(timer); timer = setInterval(() => { if (!carouselShouldPause(el)) show(i + 1); }, 7000); };
  restart();
  CLEANUP.push(() => clearInterval(timer));
}
/* ─── DAVID'S PIECE ──────────────────────────────────────────────────
   The carousel never pauses right now, even when someone is reading a
   slide. Make this return true when it SHOULD pause, for example:
     • the mouse is over the carousel        (hint: el.matches(':hover'))
     • keyboard focus is inside it           (hint: el.contains(document.activeElement))
     • the browser tab is hidden             (hint: document.hidden)
     • the user prefers reduced motion       (hint: matchMedia('(prefers-reduced-motion: reduce)').matches)
   One line with || between the checks is enough.                       */
function carouselShouldPause(el) {
  return false;
}

/* ---------- Mini knowledge graph --------------------------------------
   Shows ONE thing in the middle and only what is DIRECTLY connected to it.
   - { focus: id }            → an entity and its direct neighbours
   - { query, records }       → the search words in the middle, joined to
                                 the people/places/topics most common in
                                 the results
   Gold lines = a relationship with a cited source. Grey = appear in the
   same records (the number is how many).                               */
function neighboursOf(id, limit = 14) {
  const out = new Map();
  for (const [a, label, b, el, eu] of RELATIONS) {
    if (a === id && node(b)) out.set(b, { id: b, kind: 'rel', label, w: 99, el, eu, dir: 'out' });
    if (b === id && node(a)) out.set(a, { id: a, kind: 'rel', label, w: 99, el, eu, dir: 'in' });
  }
  for (const [k, c] of CO) {
    const [a, b] = k.split('|'); const other = a === id ? b : b === id ? a : null;
    if (other && node(other) && !out.has(other)) out.set(other, { id: other, kind: 'co', label: plural(c, 'shared record'), w: c });
  }
  return [...out.values()].sort((x, y) => y.w - x.w).slice(0, limit);
}
function mountMiniGraph(el, opt) {
  if (!el) return;
  let centre, nbrs;
  if (opt.focus) {
    const n = node(opt.focus); if (!n) { el.innerHTML = ''; return; }
    centre = { id: opt.focus, label: n.name, type: n.type };
    nbrs = neighboursOf(opt.focus, 10);
  } else {
    const count = new Map();
    for (const r of (opt.records || []).slice(0, 60)) for (const l of publicLinks(r)) if (l.kind !== 'topic' || true) count.set(l.id, (count.get(l.id) || 0) + 1);
    centre = { id: '__q', label: opt.query ? `“${opt.query}”` : 'Results', type: 'query' };
    nbrs = [...count].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id, c]) => ({ id, kind: 'co', label: plural(c, 'result'), w: c }));
  }
  if (!nbrs.length) { el.innerHTML = '<p class="meta">Nothing is linked to this yet.</p>'; return; }
  el.innerHTML = '<canvas aria-label="Connections graph"></canvas><div class="mg-detail" aria-live="polite"></div><ul class="sr-only"></ul>';
  // screen-reader / no-canvas fallback: the same connections as a list
  $('ul', el).innerHTML = nbrs.map(x => `<li><a href="${href('e/' + x.id)}">${h(nameOf(x.id))}</a> (${h(x.label)})</li>`).join('');
  const canvas = $('canvas', el);
  canvas.style.height = '270px';
  // radial layout: the centre in the middle, neighbours evenly around it (no drifting)
  const nodes = [{ ...centre, r: 13, x: 0, y: 0 }, ...nbrs.map((x, i) => {
    const n = node(x.id), a = -Math.PI / 2 + i * 2 * Math.PI / nbrs.length, rad = i % 2 ? 120 : 96;
    return { id: x.id, label: n.name, type: n.type, r: x.kind === 'rel' ? 8 : 5 + Math.min(5, Math.sqrt(x.w) * 1.5), x: Math.cos(a) * rad * 1.1, y: Math.sin(a) * rad };
  })];
  const edges = nbrs.map(x => ({ s: centre.id, t: x.id, kind: x.kind === 'rel' ? 'rel' : 'co', w: x.kind === 'rel' ? 2 : 1, label: x.label }));
  const g = createGraph(canvas, {
    nodes, edges, fixed: true, allLabels: true, labelMax: 22, fitPad: 190,
    centreId: centre.id,
    // click an outer node → show how it connects (click the centre or empty space to clear)
    onClick: n => showDetail(n && n.id !== centre.id ? n : null),
    onOpen: n => { if (n && n.id !== '__q') go('e/' + n.id); }
  });
  const box = $('.mg-detail', el);
  function showDetail(n) {
    if (!n) { box.innerHTML = '<p class="meta">Select a name to see how it connects.</p>'; return; }
    const x = nbrs.find(y => y.id === n.id), N = node(n.id);
    const how = x.kind === 'rel'
      ? (x.dir === 'out' ? `${h(centre.label)} ${h(x.label)} ${h(N.name)}` : `${h(N.name)} ${h(x.label)} ${h(centre.label)}`)
      : `Appears with ${h(centre.label)} in ${h(x.label)}`;
    const src = x.kind === 'rel' && x.eu ? `<p class="meta">Source: ${/^https?:/.test(x.eu) ? ext(x.eu, h(x.el)) : `<a href="${href('r/' + x.eu)}">${h(x.el)}</a>`}</p>` : '';
    box.innerHTML = `<p class="mg-name">${h(N.name)} <span class="meta">${typeLabel(N.type)}</span></p><p>${how}.</p>${src}<a class="ext" href="${href('e/' + n.id)}">Open ${h(N.name)}</a>`;
  }
  showDetail(null);
  CLEANUP.push(() => g.destroy());
}


/* ---- ask.js ---- */
/* ═══ 7. ASK — grounded question answering ═════════════════════════ */
const TYPE_WORDS = [[/photo|picture|image/i, ['Photograph', 'Photograph collection']], [/letter|correspond/i, ['Correspondence']], [/map|plan/i, ['Map / plan / view']], [/court|legal|affidavit/i, ['Court record', 'Legal / government document']],
  [/newspaper|advert|clipping/i, ['Newspaper item']], [/object|artifact|artefact|medal|badge|quilt/i, ['Museum object']], [/stamp/i, ['Stamp / philatelic record']], [/film|video/i, ['Moving image']], [/list|register|census|return/i, ['List / register', 'Register (copy)']], [/book/i, ['Book']], [/municipal|council|series/i, ['Record series (municipal)']]];
const INST_WORDS = { nsa: /nova scotia archives|\bnsa\b|provincial archives/i, lac: /library and archives|\blac\b|national archives of canada/i, cwm: /war museum|\bcwm\b/i, hma: /municipal archives|halifax archives|\bhma\b/i, bccns: /black cultural centre|bccns/i };

function parseQuestion(q) {
  const found = [];
  const ids = [...Object.keys(ENTITIES), ...Object.keys(PLACES)];
  let rest = ' ' + q + ' ';
  // longest names first so "North Preston" wins over "Preston"
  const cands = ids.flatMap(id => [node(id).name, ...(node(id).aliases || [])].filter(a => a && a.length > 3).map(a => [id, a])).sort((a, b) => b[1].length - a[1].length);
  for (const [id, a] of cands) {
    const re = new RegExp('\\b' + a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/^'|'$/g, '') + '\\b', 'i');
    if (re.test(rest) && ENT_RECS.get(id)?.size) { if (!found.includes(id)) found.push(id); rest = rest.replace(re, ' '); }
  }
  let from = null, to = null, m;
  if ((m = q.match(/between\s+(\d{4})\s+and\s+(\d{4})/i))) { from = +m[1]; to = +m[2]; }
  else if ((m = q.match(/(?:before|until|prior to)\s+(\d{4})/i))) to = +m[1] - 1;
  else if ((m = q.match(/(?:after|since)\s+(\d{4})/i))) from = +m[1] + 1;
  else if ((m = q.match(/\b(1[6-9]\d0|20[0-2]0)s\b/))) { from = +m[1]; to = +m[1] + 9; }
  else if ((m = q.match(/\bin\s+(1[6-9]\d\d|20[0-2]\d)\b/))) { from = to = +m[1]; }
  const types = TYPE_WORDS.filter(([re]) => re.test(q)).flatMap(([, t]) => t);
  const insts = Object.keys(INST_WORDS).filter(k => INST_WORDS[k].test(q));
  const intent = /where|held|hold|visit|access|see (them|it|the)|view/i.test(q) ? 'where' : /^\s*(who|which people)|people|person|named/i.test(q) ? 'who' : /^\s*when|what year|how old|date/i.test(q) ? 'when' : /how many|number of|count/i.test(q) ? 'count' : 'what';
  const leftover = tok(rest.replace(/\b(1[6-9]\d\d|20\d\d)s?\b/g, ' ')).filter(t => !/^(photo|photos|photograph|photographs|picture|pictures|letters?|maps?|records?|documents?|see|held|hold|visit|access|named|people|person|before|after|between|since|until|many|number|year|years|tell|know|anything|information|info|nova|scotia|black|history)$/.test(t) && !TYPE_WORDS.some(([re]) => re.test(t)));
  return { found, from, to, types, insts, intent, leftover };
}

function retrieve(pq) {
  let pool = RECORDS;
  if (pq.found.length) {
    const and = pool.filter(r => pq.found.every(id => publicLinks(r).some(l => l.id === id) || r.holder === id));
    pool = and.length ? and : pool.filter(r => pq.found.some(id => publicLinks(r).some(l => l.id === id)));
  }
  if (pq.from != null) pool = pool.filter(r => r.dateEnd != null && r.dateEnd >= pq.from);
  if (pq.to != null) pool = pool.filter(r => r.dateStart != null && r.dateStart <= pq.to);
  if (pq.types.length) pool = pool.filter(r => pq.types.includes(r.resourceType));
  if (pq.insts.length) pool = pool.filter(r => pq.insts.includes(r.holder) || pq.insts.includes(r.provider));
  let scored = pool.map(r => ({ r, s: pq.leftover.length ? scoreDoc(SEARCH_DOCS.find(d => d.r === r), pq.leftover.filter(t => t.length > 2)) : 1 }));
  if (!pq.found.length) scored = scored.filter(x => x.s > 0);       // nothing named → need keyword evidence
  return scored.sort((a, b) => b.s - a.s || (a.r.dateStart ?? 9999) - (b.r.dateStart ?? 9999)).map(x => x.r);
}

function composeAnswer(q) {
  const pq = parseQuestion(q), hits = retrieve(pq);
  const cites = [];
  const cite = r => { let i = cites.indexOf(r); if (i < 0) { cites.push(r); i = cites.length - 1; } return `<a class="cite" href="${href('r/' + r.id)}" title="${h(r.title)}">[${i + 1}]</a>`; };
  const understood = [...pq.found.map(id => chip(id)), pq.from || pq.to ? `<span class="tag">${pq.from ?? '…'}–${pq.to ?? '…'}</span>` : '', ...[...new Set(pq.types)].slice(0, 2).map(t => `<span class="tag">${h(t)}</span>`), ...pq.insts.map(k => `<span class="tag">${h(instName(k))}</span>`)].filter(Boolean).join(' ');
  const lines = [];
  if (!hits.length) {
    const near = entityMatches(pq.leftover.join(' '), 5);
    return { html: `<p><b>No record in the hub answers that.</b> Rather than guess, here is what was understood.</p>
      ${understood ? `<p class="meta">I understood: ${understood}</p>` : ''}
      ${pq.leftover.length ? `<p class="meta">No record mentions: ${pq.leftover.map(t => `<code>${h(t)}</code>`).join(' ')}</p>` : ''}
      ${near.length ? `<p>Closest pages: ${near.map(x => chip(x.id)).join(' ')}</p>` : ''}`, cites: [], hits, pq };
  }
  const holders = [...new Set(hits.map(r => r.holder))];
  lines.push(`I found <b>${hits.length}</b> record${hits.length > 1 ? 's' : ''} held by <b>${holders.length}</b> institution${holders.length > 1 ? 's' : ''}${understood ? ` for ${understood}` : ''}.`);
  const top = hits.slice(0, 6);
  if (pq.intent === 'where') {
    for (const k of holders.slice(0, 5)) {
      const rs = hits.filter(r => r.holder === k), I = INSTITUTIONS[k];
      const online = rs.filter(r => /^Online/.test(r.access.status)).length;
      lines.push(`<b>${h(I.name)}</b> holds ${rs.length} of them${online ? ` (${online} viewable online)` : ''}. ${I.address ? 'Visit: ' + h(I.address) + '. ' : ''}${h(I.access)} ${rs.slice(0, 3).map(cite).join('')}`);
    }
  } else if (pq.intent === 'when') {
    const dated = hits.filter(r => r.dateStart != null).sort((a, b) => a.dateStart - b.dateStart);
    if (dated.length) {
      lines.push(`The earliest is “${h(dated[0].title)}”, dated <b>${h(dated[0].dateText)}</b> ${cite(dated[0])}.`);
      if (dated.length > 1) lines.push(`The latest is “${h(dated.at(-1).title)}”, dated <b>${h(dated.at(-1).dateText)}</b> ${cite(dated.at(-1))}.`);
    }
    if (hits.length - dated.length) lines.push(`${hits.length - dated.length} of them have no date in the source.`);
  } else if (pq.intent === 'who') {
    const ppl = new Map();
    for (const r of hits) for (const l of publicLinks(r)) if (l.kind === 'person' && !pq.found.includes(l.id)) { if (!ppl.has(l.id)) ppl.set(l.id, r); }
    lines.push(ppl.size ? `People named in these records: ${[...ppl].slice(0, 10).map(([id, r]) => `${chip(id)}${cite(r)}`).join(', ')}.` : 'These records do not name any person the hub recognises.');
  } else if (pq.intent === 'count') {
    const byT = {}; for (const r of hits) (byT[r.resourceType] = byT[r.resourceType] || []).push(r);
    lines.push(Object.entries(byT).map(([t, rs]) => `${rs.length} × ${h(t)} ${cite(rs[0])}`).join('; ') + '.');
  }
  if (pq.intent !== 'who' && pq.intent !== 'count') for (const r of top.slice(0, pq.intent === 'what' ? 6 : 3))
    lines.push(`“${h(r.title)}” (${h(r.dateText || 'no date')}) — ${h(r.resourceType.toLowerCase())}, held by ${h(instName(r.holder))} ${cite(r)}`);
  const places = [...new Set(hits.flatMap(r => r.mapped))];
  if (places.length) lines.push(`Places named: ${places.slice(0, 8).map(p => chip(p)).join(' ')}.`);
  const ctx = pq.found.flatMap(id => (node(id).statements || []).slice(0, 1).map(s => [id, s]));
  return {
    html: `<ul class="ans">${lines.map(l => `<li>${l}</li>`).join('')}</ul>
      ${ctx.length ? `<section class="quotes">${ctx.map(([id, [t, l, u]]) => `<blockquote><p>“${h(t)}”</p><footer>${ext(u, h(l))}</footer></blockquote>`).join('')}</section>` : ''}`,
    cites, hits, pq
  };
}

let LLM = { key: '', model: 'claude-sonnet-4-5' };     // key kept in memory only — never saved
function viewAsk(p) {

  onMount(bindSearchBox);

      catch (err) { out.innerHTML = `<p class="notice notice-rejected">Claude could not be reached (${h(err.message)}). The answer above is unaffected.</p>`; }
    };
  });
  return `<div class="wrap page search-page">
    ${searchBox(p.ask, 'ask')}
    <div class="two">
      <section class="answer">

        ${a.html}
        <p class="meta">This answer is built only from the sources listed. Nothing is added from general knowledge.</p>
        <details class="llm"><summary>Have Claude phrase the answer</summary>
          <p class="meta">Optional. Uses your own Anthropic API key, kept in memory and sent only to Anthropic. Claude sees only the listed sources, and any sentence without a source number is removed.</p>
          <form id="llm-form" class="llm-form"><label class="sr-only" for="llm-key">API key</label><input id="llm-key" name="key" type="password" placeholder="Anthropic API key" value="${h(LLM.key)}" autocomplete="off"><label class="sr-only" for="llm-model">Model</label><input id="llm-model" name="model" value="${h(LLM.model)}"><button class="btn btn-secondary">Ask Claude</button></form>
          <div id="llm-out"></div></details>
      </section>
      <aside class="side"><section class="panel">
        <h2 class="h3">Sources (${a.cites.length})</h2>

        ${a.hits.length > a.cites.length ? `<a href="${href('search', { q: [...a.pq.found.map(nameOf), ...a.pq.leftover].join(' '), from: a.pq.from ?? '', to: a.pq.to ?? '' })}">See all ${a.hits.length} matching records</a>` : ''}
      </section></aside>
    </div></div>`;
}

async function askClaude(question, recs) {
  const context = recs.map((r, i) => `[${i + 1}] ${JSON.stringify({ title: r.title, date: r.dateText, type: r.resourceType, holder: instName(r.holder), description: r.description, reference: r.reference, collection: r.collection, access: r.access.note, people_places_topics: publicLinks(r).map(l => nameOf(l.id)) })}`).join('\n');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': LLM.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: LLM.model, max_tokens: 700, system: 'You answer questions for a Black history discovery hub. Use ONLY the numbered records provided. Every sentence must end with one or more citations like [2]. If the records do not answer the question, say so plainly. Never add facts, dates, names or interpretation that are not in the records. Plain language, under 150 words.',
      messages: [{ role: 'user', content: `Records:\n${context}\n\nQuestion: ${question}` }] })
  });
  if (!res.ok) throw new Error(`${res.status} ${(await res.text()).slice(0, 160)}`);
  const data = await res.json();
  const text = (data.content || []).map(c => c.text || '').join(' ');
  // grounding check: keep only sentences that cite a record we actually sent
  const sentences = text.split(/(?<=[.!?])\s+/).filter(Boolean);
  const kept = [], dropped = [];
  for (const s of sentences) {
    const nums = [...s.matchAll(/\[(\d+)\]/g)].map(m => +m[1]);
    (nums.length && nums.every(n => n >= 1 && n <= recs.length) ? kept : dropped).push(s);
  }
  const linked = kept.map(s => h(s).replace(/\[(\d+)\]/g, (_, n) => `<a class="cite" href="${href('r/' + recs[n - 1].id)}">[${n}]</a>`));
  return `<div class="llm-ans"><p>${linked.join(' ') || '<i>Claude gave no cited sentences.</i>'}</p>
    <p class="meta">Grounding check: ${kept.length} sentence(s) kept${dropped.length ? `, <b>${dropped.length} removed</b> for missing or invalid citations` : ''}. Citation numbers refer to the Sources list.</p></div>`;
}


/* ---- views.js ---- */
/* =====================================================================
   views.js — the public screens
   ---------------------------------------------------------------------
   home · browse · search (+ mini graph) · entity page · record · map ·
   institutions · suggest a resource
   Rule of thumb for this file: one job per screen, few things at once,
   every record shows who holds it and links to the original.
   ===================================================================== */

/* ---------- small building blocks ---------- */
const TYPE_NAME = { person: 'Person', place: 'Place', organization: 'Organization', event: 'Event', topic: 'Topic', institution: 'Institution' };
const PLURAL = { person: 'People', place: 'Places and communities', organization: 'Organizations', event: 'Events and meetings', topic: 'Topics', institution: 'Institutions' };
const typeLabel = t => TYPE_NAME[t] || t;
const tag = (id, extra = '') => { const n = node(id); if (!n) return ''; return `<a class="tag" href="${href('e/' + id)}">${h(n.name)}${extra}</a>`; };
const chip = tag;                                   // ask.js uses chip()
const dateLabel = r => r.dateText ? h(r.dateText) : 'Date not recorded';
const span = recs => { const ys = recs.flatMap(r => [r.dateStart, r.dateEnd]).filter(y => y != null); return ys.length ? (Math.min(...ys) === Math.max(...ys) ? `${Math.min(...ys)}` : `${Math.min(...ys)}–${Math.max(...ys)}`) : 'undated'; };
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const facetKeyFor = t => ({ person: 'person', place: 'place', organization: 'org', event: 'event', topic: 'topic', institution: 'holder' }[t] || 'topic');
/* "See it on the map" links: only when the place/institution really has a pin */
const hasPin = k => PLACES[INSTITUTIONS[k]?.place]?.lat != null;
const addressLink = k => { const I = INSTITUTIONS[k]; if (!I) return ''; const t = h(I.address || 'Address not confirmed');
  return hasPin(k) ? `<a class="addr" href="${href('map', { focus: 'i:' + k })}" title="Show ${h(I.name)} on the map">${t}</a>` : t; };
const ext = (url, label) => `<a class="ext" href="${h(url)}" target="_blank" rel="noopener">${label}<span aria-hidden="true"> ↗</span></a>`;

function recordRow(r) {
  return `<article class="rrow">
    ${r.image ? `<a class="rrow-img" href="${href('r/' + r.id)}" tabindex="-1"><img loading="lazy" src="${h(r.image)}" alt="" onerror="this.parentNode.remove()"></a>` : ''}
    <div class="rrow-body">
      <h3><a href="${href('r/' + r.id)}">${h(r.title)}</a></h3>
      <p class="meta">${h(r.resourceType)} · ${dateLabel(r)} · Held by ${h(instName(r.holder))}</p>
      ${r.description ? `<p class="rrow-desc">${h(r.description)}</p>` : ''}
      ${ext(r.url, `View original at ${h(instName(r.provider))}`)}
    </div></article>`;
}

/* ═══ HOME ═════════════════════════════════════════════════════════ */

function browseIds(t) {
  const pool = t === 'place' ? Object.keys(PLACES) : t === 'institution' ? Object.keys(INSTITUTIONS) : Object.keys(ENTITIES).filter(i => ENTITIES[i].type === t && !ENTITIES[i].creator);
  return pool.filter(i => ENT_RECS.get(i)?.size).sort((a, b) => ENT_RECS.get(b).size - ENT_RECS.get(a).size);
}

/* ---------- search box (Search / Ask) ---------- */
function searchBox(q, mode = 'search') {
  const ex = mode === 'ask'
    ? ['Where can I see records about Viola Desmond?', 'Photographs of Upper Hammonds Plains', 'Who is named in records about Five Mile Plains?']
    : ['Africville', 'Preston', 'Viola Desmond', 'No. 2 Construction Battalion', '1946'];
  return `<form id="sbox" class="sbox" role="search">
    <div class="sbox-mode" role="tablist" aria-label="Search mode">
      <button type="button" role="tab" data-mode="search" aria-selected="${mode === 'search'}">Search</button>
      <button type="button" role="tab" data-mode="ask" aria-selected="${mode === 'ask'}">Ask a question</button>
    </div>
    <div class="sbox-row">
      <div class="sbox-field">
        <label class="sr-only" for="q">${mode === 'ask' ? 'Your question' : 'Search records'}</label>
        <input id="q" name="q" autocomplete="off" value="${h(q)}" placeholder="${mode === 'ask' ? 'Ask about a person, place or event' : 'People, places, communities, subjects, years'}"
          ${mode === 'search' ? 'role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false"' : ''}>
        <div id="suggest" class="suggest" role="listbox" hidden></div>
      </div>
      <button class="btn btn-primary" type="submit">${mode === 'ask' ? 'Ask' : 'Search'}</button>
    </div>
    <p class="sbox-ex">Try ${ex.map(x => `<button type="button" class="linklike" data-ex="${h(x)}">${h(x)}</button>`).join(', ')}</p>
  </form>`;
}
function bindSearchBox() {
  const f = $('#sbox'); if (!f) return;
  let mode = $('[aria-selected="true"]', f).dataset.mode;
  $$('.sbox-mode button', f).forEach(b => b.onclick = () => {
    if (b.dataset.mode === mode) return;
    const q = $('#q', f).value; f.outerHTML = searchBox(q, b.dataset.mode); bindSearchBox(); $('#q').focus();
  });
  f.onsubmit = e => { e.preventDefault(); const q = $('#q', f).value.trim(); if (!q) return; mode === 'ask' ? go('search', { ask: q }) : go('search', { q }); };
  $$('[data-ex]', f).forEach(b => b.onclick = () => { $('#q', f).value = b.dataset.ex; f.requestSubmit(); });
  const inp = $('#q', f), box = $('#suggest', f);
  if (mode !== 'search') return;
  // live suggestions: matching pages (people, places, topics…) and matching records
  let active = -1;
  const mark = (text, q) => { const i = norm(text).indexOf(norm(q)); return i < 0 ? h(text) : h(text.slice(0, i)) + '<b>' + h(text.slice(i, i + q.length)) + '</b>' + h(text.slice(i + q.length)); };
  const close = () => { box.hidden = true; inp.setAttribute('aria-expanded', 'false'); active = -1; };
  inp.oninput = () => {
    const q = inp.value.trim();
    if (q.length < 2) { close(); return; }
    const pages = entityMatches(q, 5);
    const recs = runSearch({ q }).slice(0, 4);
    if (!pages.length && !recs.length) { box.innerHTML = `<p class="sug-none">No matches for “${h(q)}”</p>`; box.hidden = false; return; }
    box.innerHTML = (pages.length ? `<p class="sug-h">Pages</p>${pages.map(x => `<a role="option" href="${href('e/' + x.id)}"><span>${mark(x.n.name, q)}</span><span class="meta">${typeLabel(x.n.type)} · ${plural(x.count, 'record')}</span></a>`).join('')}` : '')
      + (recs.length ? `<p class="sug-h">Records</p>${recs.map(r => `<a role="option" href="${href('r/' + r.id)}"><span>${mark(r.title, q)}</span><span class="meta">${h(r.dateText || '')}</span></a>`).join('')}` : '')
      + `<a role="option" class="sug-all" href="${href('search', { q })}">See all results for “${h(q)}”</a>`;
    box.hidden = false; inp.setAttribute('aria-expanded', 'true'); active = -1;
  };
  inp.onkeydown = e => {
    const opts = $$('a[role="option"]', box);
    if (box.hidden || !opts.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.classList.toggle('on', i === active));
      opts[active].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); location.hash = opts[active].getAttribute('href'); }
    else if (e.key === 'Escape') close();
  };
  inp.onfocus = () => { if (inp.value.trim().length >= 2) inp.oninput(); };
  inp.onblur = () => setTimeout(close, 180);
}

/* ═══ BROWSE ═══════════════════════════════════════════════════════ */
function viewBrowse(type = 'person') {
  if (!PLURAL[type]) type = 'person';
  const ids = browseIds(type);

    <h1>${PLURAL[type]}</h1>
    <div class="egrid">${ids.map(id => { const rs = recsOf(id); return `<a class="ecard" href="${href('e/' + id)}"><h2 class="h3">${h(nameOf(id))}</h2><p class="meta">${plural(rs.length, 'record')} · ${span(rs)}</p></a>`; }).join('')}</div>
  </div>`;
}

/* ═══ SEARCH ═══════════════════════════════════════════════════════ */
function viewSearch(_, p) {
  if (p.ask) return viewAsk(p);
  const hits = runSearch(p);
  const n = +(p.n || 20);
  const sel = (key, label, get, name) => {
    const counts = new Map();
    for (const r of hits) for (const v of new Set(get(r))) counts.set(v, (counts.get(v) || 0) + 1);
    if (p[key] && !counts.has(p[key])) counts.set(p[key], 0);
    const opts = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 25);
    return `<label class="fsel"><span>${label}</span><select data-k="${key}"><option value="">Any</option>${opts.map(([v, c]) => `<option value="${h(v)}" ${p[key] === v ? 'selected' : ''}>${h(name(v))} (${c})</option>`).join('')}</select></label>`;
  };
  const entityFilters = ['person', 'org', 'event', 'topic'].filter(k => p[k]);
  // the centre of the mini graph: the entity the query names, else the query itself
  const top = p.q ? entityMatches(p.q, 1).find(x => x.rank <= 1) : null;
  const focus = entityFilters.length ? p[entityFilters[0]] : (p.place || top?.id || null);
  onMount(bindSearchBox);
  onMount(() => {
    $$('.filters select').forEach(s => s.onchange = () => go('search', { ...p, [s.dataset.k]: s.value, n: '' }));
    const yf = $('#years'); if (yf) yf.onsubmit = e => { e.preventDefault(); go('search', { ...p, from: yf.from.value, to: yf.to.value }); };
    mountMiniGraph($('#mini-graph'), focus ? { focus } : { query: p.q, records: hits });
    mountRecordsMap($('#mini-map'), hits, { lines: false });
  });
  const mapped = hits.filter(r => r.mapped.length).length;
  return `<div class="wrap page search-page">
    ${searchBox(p.q || '')}
    <div class="filters">
      ${sel('holder', 'Held by', r => [r.holder], instName)}
      ${sel('type', 'Type', r => [r.resourceType], x => x)}
      ${sel('place', 'Place', r => r.places, nameOf)}
      <form id="years" class="fsel years"><span>Years</span><div><input name="from" inputmode="numeric" placeholder="From" value="${h(p.from || '')}" aria-label="From year"><input name="to" inputmode="numeric" placeholder="To" value="${h(p.to || '')}" aria-label="To year"><button class="btn btn-quiet" type="submit">Apply</button></div></form>
    </div>
    ${entityFilters.length ? `<p class="active-f">Showing records linked to ${entityFilters.map(k => `<a class="tag tag-x" href="${href('search', { ...p, [k]: '' })}" aria-label="Remove ${h(nameOf(p[k]))}">${h(nameOf(p[k]))} ×</a>`).join(' ')}</p>` : ''}
    <div class="search-cols">
      <section aria-live="polite">
        <p class="count">${plural(hits.length, 'result')}${p.q ? ` for “${h(p.q)}”` : ''}</p>
        ${!hits.length ? `<div class="empty"><h2>Nothing matches yet</h2><p>The hub only shows what institutions have described. Try fewer words or another spelling, or <a href="${href('search', { ask: p.q })}">ask it as a question</a>.</p></div>` : ''}
        <div class="rlist">${hits.slice(0, n).map(recordRow).join('')}</div>
        ${hits.length > n ? `<a class="btn btn-secondary more" href="${href('search', { ...p, n: n + 20, keep: 1 })}">Show more results</a>` : ''}
      </section>
      <aside class="side">
        <section class="panel">
          <h2 class="h3">${focus ? `Connected to ${h(nameOf(focus))}` : p.q ? `Connected to “${h(p.q)}”` : 'Connections'}</h2>
          <div id="mini-graph" class="mini-graph"></div>
          
        </section>
        <section class="panel">
          <h2 class="h3">On the map</h2>
          <div id="mini-map" class="map map-sm"></div>
          <p class="meta">${mapped} of ${hits.length} results have a place. <a href="${href('map', { q: p.q, holder: p.holder, place: p.place, from: p.from, to: p.to })}">Open the full map</a></p>
        </section>
      </aside>
    </div></div>`;
}

/* ═══ ENTITY PAGE (person · place · organization · event · topic · institution) ═══ */
function viewEntity(id) {
  const n = node(id);
  if (!n) return `<div class="wrap page"><h1>Not found</h1><p>There is no page for “${h(id)}”.</p></div>`;
  const recs = recsOf(id).sort((a, b) => (a.dateStart ?? 9999) - (b.dateStart ?? 9999));
  const holders = [...new Set(recs.map(r => r.holder))];
  const rels = RELATIONS.filter(r => r[0] === id || r[2] === id);
  const statements = n.statements || [];
  const kind = typeLabel(n.type) + (n.community ? ' · community' : '') + (n.meeting ? ' · meeting' : '');
  onMount(() => mountMiniGraph($('#ent-graph'), { focus: id }));
  onMount(() => mountRecordsMap($('#ent-map'), recs, { lines: true, focusPlace: PLACES[id]?.lat != null ? id : null }));
  const shown = 6;
  return `<div class="wrap page">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="${href('browse/' + (n.type === 'place' ? 'place' : n.type))}">${PLURAL[n.type] || 'Browse'}</a></nav>
    <h1>${h(n.name)}</h1>
    <p class="meta lead-meta">${PLACES[id]?.lat != null ? `<a href="${href('map', { focus: 'p:' + id })}">See ${h(n.name)} on the map</a> · ` : ''}${kind} · ${plural(recs.length, 'record')}${n.type === 'institution' ? '' : ' · ' + plural(holders.length, 'institution')} · ${span(recs)}</p>
    <div class="two">
      <div>
        ${statements.length ? `<section class="quotes">${statements.map(([t, l, u]) => `<blockquote><p>“${h(t)}”</p><footer>${ext(u, h(l))}</footer></blockquote>`).join('')}</section>` : ''}
        ${n.note ? `<p>${h(n.note)}</p>` : ''}
        ${n.type === 'institution' ? `<section class="panel"><h2 class="h3">Visiting</h2><p>${n.address ? addressLink(id) : 'Visitor address not confirmed.'}</p><p class="meta">${h(n.access || '')}</p>${n.web ? ext(n.web, h(n.web.replace(/^https?:\/\//, ''))) : ''}</section>` : ''}
        <section class="section-sm">
          <div class="row-between"><h2>Records</h2>${recs.length ? `<a href="${href('search', { [facetKeyFor(n.type)]: id })}">Search within these</a>` : ''}</div>
          ${recs.length ? `<div class="rlist">${recs.slice(0, shown).map(recordRow).join('')}</div>
            ${recs.length > shown ? `<details class="more-recs"><summary>Show ${recs.length - shown} more</summary><div class="rlist">${recs.slice(shown).map(recordRow).join('')}</div></details>` : ''}`
            : '<p>No records are linked yet.</p>'}
        </section>
      </div>
      <aside class="side">
        <section class="panel">
          <h2 class="h3">Directly connected</h2>
          <div id="ent-graph" class="mini-graph"></div>
          ${rels.length ? `<details class="rels-d"><summary>Sources for these connections</summary><ul class="rels">${rels.map(([a, label, b, el, eu]) => `<li>${a === id ? '' : tag(a) + ' '}<span>${h(label)}</span>${b === id ? '' : ' ' + tag(b)}<span class="meta"> Source: ${/^https?:/.test(eu) ? ext(eu, h(el)) : `<a href="${href('r/' + eu)}">${h(el)}</a>`}</span></li>`).join('')}</ul></details>` : ''}
        </section>
        ${holders.length && n.type !== 'institution' ? `<section class="panel"><h2 class="h3">Where to find it</h2>${holders.map(k => { const I = INSTITUTIONS[k]; return `<div class="where"><a href="${href('e/' + k)}">${h(I.name)}</a><p class="meta">${addressLink(k)}</p></div>`; }).join('')}</section>` : ''}
      </aside>
    </div>
    <section class="section-sm">
      <h2>Places connected to ${h(n.name)}</h2>
      <p class="meta">Green circles are places named in the records. Dark squares are where the records are held.</p>
      <div id="ent-map" class="map"></div>
    </section>
  </div>`;
}

/* ═══ RECORD ═══════════════════════════════════════════════════════ */
function viewRecord(id) {
  const r = REC.get(id);
  if (!r) return `<div class="wrap page"><h1>Record not found</h1></div>`;
  const I = INSTITUTIONS[r.holder];
  const subjects = publicLinks(r);
  const similar = RECORDS.filter(x => x !== r).map(x => [x, publicLinks(x).filter(l => l.kind !== 'topic' && subjects.some(m => m.id === l.id)).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, 4);
  onMount(() => mountRecordsMap($('#rec-map'), [r], { lines: true }));
  return `<div class="wrap page">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="${href('e/' + r.holder)}">${h(instName(r.holder))}</a></nav>
    <div class="two">
      <div>
        <h1 class="rec-title">${h(r.title)}</h1>
        <p class="meta lead-meta">${h(r.resourceType)} · ${dateLabel(r)}${r.dateApprox ? ' (approximate)' : ''}</p>
        ${r.image ? `<figure class="rec-img"><img src="${h(r.image)}" alt="Preview of ${h(r.title)}" onerror="this.parentNode.remove()"><figcaption>Preview shown from ${h(instName(r.provider))}. ${h(r.imageCredit)}</figcaption></figure>` : ''}
        ${r.description ? `<p class="rec-desc">${h(r.description)}</p>` : ''}
        <p><a class="btn btn-primary" href="${h(r.url)}" target="_blank" rel="noopener">View original record<span aria-hidden="true"> ↗</span></a></p>
        <dl class="facts">
          <dt>Held by</dt><dd><a href="${href('e/' + r.holder)}">${h(instName(r.holder))}</a></dd>
          ${r.provider !== r.holder ? `<dt>Found through</dt><dd>${h(instName(r.provider))}</dd>` : ''}
          <dt>Date</dt><dd>${dateLabel(r)}</dd>
          <dt>Reference</dt><dd>${h(r.reference || 'Not recorded')}</dd>
          ${r.creator ? `<dt>Creator</dt><dd>${h(r.creator)}</dd>` : ''}
          <dt>Collection</dt><dd>${h(r.collection)}</dd>
          <dt>Access</dt><dd>${h(r.access.status)}. ${h(r.access.note)}</dd>
        </dl>
        ${subjects.length ? `<h2 class="h3">People, places and topics</h2><div class="tags">${subjects.map(l => tag(l.id)).join('')}</div>` : ''}
        <details class="prov"><summary>Provenance</summary><ol>${r.provenance.map(s => `<li>${h(s)}</li>`).join('')}</ol>
          <p class="meta">Original metadata as harvested:</p><pre>${h(JSON.stringify(r.native, null, 2))}</pre></details>
      </div>
      <aside class="side">
        ${I ? `<section class="panel"><h2 class="h3">Visit ${h(I.name)}</h2><p>${I.address ? addressLink(r.holder) : 'Visitor address not confirmed.'}</p><p class="meta">${h(I.access)}</p></section>` : ''}
        <section class="panel"><h2 class="h3">On the map</h2>${r.mapped.length ? '' : `<p class="meta">${r.places.length ? 'The place named is too broad to pin.' : 'No place recorded.'} Showing where it is held.</p>`}<div id="rec-map" class="map map-sm"></div></section>
        ${similar.length ? `<section class="panel"><h2 class="h3">Connected records</h2>${similar.map(([x]) => `<a class="sim" href="${href('r/' + x.id)}">${h(x.title)}<span class="meta">${h(x.dateText || 'Date not recorded')} · ${h(instName(x.holder))}</span></a>`).join('')}</section>` : ''}
      </aside>
    </div></div>`;
}

/* ═══ FULL MAP (linked from pages, not in the nav) ═════════════════ */
function viewMap(_, p) {
  const recs = runSearch({ ...p, focus: '' });
  const topics = Object.keys(ENTITIES).filter(i => ENTITIES[i].type === 'topic' && ENT_RECS.get(i)?.size);
  onMount(() => {
    mountRecordsMap($('#big-map'), recs, { lines: !!p.lines, focus: p.focus });
    $('#map-topic').onchange = e => go('map', { ...p, topic: e.target.value });
    $('#map-lines').onchange = e => go('map', { ...p, lines: e.target.checked ? 1 : '' });
  });
  return `<div class="wrap page">
    <h1>Map</h1>
    <p class="lead">Places named in ${plural(recs.length, 'record')}. Records without a confirmed place stay searchable without a pin.</p>
    <div class="filters">
      <label class="fsel"><span>Topic</span><select id="map-topic"><option value="">Any</option>${topics.map(t => `<option value="${t}" ${p.topic === t ? 'selected' : ''}>${h(nameOf(t))}</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" id="map-lines" ${p.lines ? 'checked' : ''}> Show where records are held</label>
    </div>
    <div id="big-map" class="map map-xl"></div></div>`;
}

/* ═══ INSTITUTIONS ═════════════════════════════════════════════════ */
function viewInstitutions() {
  const list = Object.keys(INSTITUTIONS).filter(k => k !== 'csv' && k !== 'community').map(k => ({ k, I: INSTITUTIONS[k], held: recsOf(k).length })).filter(x => x.held).sort((a, b) => b.held - a.held);
  return `<div class="wrap page">
    <h1>Institutions</h1>
    <p class="lead">The archives, museums and organizations that hold the records, and how to reach them.</p>
    <div class="egrid wide">${list.map(({ k, I, held }) => `<div class="ecard"><h2 class="h3"><a class="card-link" href="${href('e/' + k)}">${h(I.name)}</a></h2><p class="meta">${h(I.kind)} · ${plural(held, 'record')}</p><p>${addressLink(k)}</p></div>`).join('')}</div>
  </div>`;
}

/* ═══ SUGGEST A RESOURCE (public submission → admin review) ════════ */
function viewSuggest(_, p) {
  onMount(() => {
    const f = $('#sub-form'); if (!f) return;
    f.onsubmit = e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      if (!/^https?:\/\//.test(d.url)) { $('#sub-err').hidden = false; f.url.focus(); return; }
      SUBS.unshift({ id: Date.now().toString(36), at: new Date().toISOString(), status: 'pending', ...d });
      logActivity(`New suggestion: “${d.title}”`); saveAll();
      go('suggest', { sent: 1 });
    };
  });
  if (p.sent) return `<div class="wrap page narrow"><h1>Thank you</h1><p class="lead">Your suggestion is waiting for a curator. Once it's checked against the original record, it will appear in search.</p><p><a class="btn btn-secondary" href="${href('suggest')}">Suggest another</a> <a class="btn btn-quiet" href="#/">Back to search</a></p></div>`;
  return `<div class="wrap page narrow">
    <h1>Suggest a resource</h1>
    <p class="lead">Know of a Black history record held somewhere we don't list yet? Tell us where it is. A curator checks every suggestion before it appears.</p>
    <form id="sub-form" class="form">
      <label>Title of the record<input name="title" required></label>
      <label>Link to the original record<input name="url" type="url" required placeholder="https://"></label>
      <p id="sub-err" class="notice notice-rejected" hidden>Please add a link that starts with https:// so people can reach the original.</p>
      <label>Institution that holds it<input name="holder" required></label>
      <div class="form-2"><label>Date, as written<input name="dateText" placeholder="e.g. ca. 1920"></label><label>Place<input name="place" placeholder="e.g. Preston"></label></div>
      <label>Type of record<input name="type" placeholder="e.g. Photograph, Letter"></label>
      <label>Short description<textarea name="description" rows="4"></textarea></label>
      <label>Your name (optional)<input name="name"></label>
      <button class="btn btn-primary" type="submit">Send suggestion</button>
    </form></div>`;
}
function submissionToRecord(s) {
  let holder = Object.keys(INSTITUTIONS).find(k => norm(INSTITUTIONS[k].name) === norm(s.holder));
  if (!holder) { holder = 'sub-' + norm(s.holder).replace(/\W+/g, '-'); INSTITUTIONS[holder] = INSTITUTIONS[holder] || { name: s.holder, kind: 'Named in a suggestion', address: '', place: '', access: 'Visitor details not yet confirmed by a curator.' }; }
  return {
    id: 'sub-' + s.id, source: 'sub', sourceRecordId: s.id, title: s.title, description: s.description || '', dateText: s.dateText || '',
    resourceType: s.type || 'Record', resourceTypeRule: 'Given by the person who suggested it', holder, provider: 'community', url: s.url,
    reference: '', creator: '', collection: 'Community suggestion', themeKey: 'sub:*', placesText: s.place || '',
    access: { status: 'Catalogue online', note: 'Check the original record for access.' },
    image: '', native: { ...s },
    provenance: [`Suggested ${s.at.slice(0, 10)}${s.name ? ' by ' + s.name : ''}.`, `Approved by a curator ${String(s.decidedAt || '').slice(0, 10)}.`]
  };
}
if (!INSTITUTIONS.community) INSTITUTIONS.community = { name: 'Community suggestions', kind: 'Approved public suggestions', address: '', place: '', access: 'Suggested by the public and checked by a curator.' };


/* ---- admin.js ---- */
/* =====================================================================
   admin.js — curator / administrator screens  (#/admin/<tab>)
   ---------------------------------------------------------------------
   Dashboard · Review queue · Suggestions · Institutions · Import CSV ·
   Sources · Data and backup
   No sign-in in this prototype. Everything is saved in this browser
   (see saveAll in core.js). A real deployment puts this behind a login
   and stores decisions with the curator's name.
   ===================================================================== */

const ADMIN_TABS = [['dashboard', 'Dashboard'], ['review', 'Review queue'], ['suggestions', 'Suggestions'], ['institutions', 'Institutions'], ['import', 'Import CSV'], ['sources', 'Sources'], ['data', 'Data and backup']];
const statusWord = s => `<span class="status status-${s}">${{ pending: 'Pending', approved: 'Approved', confirmed: 'Approved', rejected: 'Rejected', suggested: 'Pending' }[s] || s}</span>`;

function viewAdmin(tab = 'dashboard', p = {}) {
  if (!ADMIN_TABS.some(t => t[0] === tab)) tab = 'dashboard';
  const body = { dashboard: adminDashboard, review: adminReview, suggestions: adminSuggestions, institutions: adminInstitutions, import: adminImport, sources: adminSources, data: adminData }[tab](p);
  return `<div class="wrap page admin">
    <p class="notice">Admin demo. There is no sign-in in this prototype, and changes are saved in this browser only.</p>
    <h1>Admin</h1>
    <nav class="subnav" aria-label="Admin sections">${ADMIN_TABS.map(([k, l]) => `<a href="${href('admin/' + k)}" ${k === tab ? 'aria-current="page"' : ''}>${l}${k === 'suggestions' && SUBS.some(s => s.status === 'pending') ? ` (${SUBS.filter(s => s.status === 'pending').length})` : ''}</a>`).join('')}</nav>
    ${body}</div>`;
}

const pendingLinks = () => RECORDS.flatMap(r => r.links.filter(l => l.status === 'suggested' && !CUR[r.id + '|' + l.id]).map(l => ({ r, l })));

function adminDashboard() {
  const stats = [
    ['Records indexed', RECORDS.length, 'search'],
    ['Suggestions waiting', SUBS.filter(s => s.status === 'pending').length, 'admin/suggestions'],
    ['Links to review', pendingLinks().length, 'admin/review'],
    ['Holding institutions', new Set(RECORDS.map(r => r.holder)).size, 'admin/institutions'],
    ['Records with no date', RECORDS.filter(r => r.dateStart == null).length, null],
    ['Records with no map location', RECORDS.filter(r => !r.mapped.length).length, null]
  ];
  return `<div class="stat-grid">${stats.map(([l, n, to]) => `<${to ? `a href="#/${to}"` : 'div'} class="stat"><span class="stat-n">${n}</span><span>${l}</span></${to ? 'a' : 'div'}>`).join('')}</div>
    <div class="two">
      <section><h2>Needs attention</h2><ul class="plain">
        ${REVIEW_FLAGS.map(f => `<li>${f.ids ? f.ids.map(i => tag(i)).join(' ') + ' ' : ''}${h(f.why)} ${f.url ? ext(f.url, 'Read more') : ''}</li>`).join('')}
        <li>${RECORDS.filter(r => /Negro|mulatto|Slums/i.test(r.title)).length} titles use historical terms that are harmful today. They are kept as the source wrote them; consider adding a content note.</li>
      </ul></section>
      <section><h2>Recent activity</h2>${ACTIVITY.length ? `<ul class="plain">${ACTIVITY.slice(0, 10).map(a => `<li><span class="meta">${new Date(a.at).toLocaleString()}</span><br>${h(a.text)}</li>`).join('')}</ul>` : '<p class="meta">Nothing yet.</p>'}</section>
    </div>`;
}

function adminReview() {
  const groups = new Map();
  for (const r of RECORDS) for (const l of r.links) if (l.status === 'suggested') { if (!groups.has(l.id)) groups.set(l.id, []); groups.get(l.id).push(r); }
  onMount(() => $$('[data-decide]').forEach(b => b.onclick = () => decide(b.dataset.rid, b.dataset.eid, b.dataset.decide || null)));
  return `<p class="lead">These links were found by keyword only. They stay hidden from the public site until you approve them.</p>
    ${[...groups].map(([eid, rs]) => { const open = rs.filter(r => !CUR[r.id + '|' + eid]).length; return `<details class="rev" ${groups.size < 4 ? 'open' : ''}><summary><b>${h(nameOf(eid))}</b> <span class="meta">${open} waiting · ${rs.length} total</span></summary>
      ${rs.map(r => { const d = CUR[r.id + '|' + eid]; const l = r.links.find(x => x.id === eid); return `<div class="rev-row"><div><a href="${href('r/' + r.id)}">${h(r.title)}</a><p class="meta">${h(l.how)}</p></div>
        <div class="rev-act">${d ? `${statusWord(d)} <button class="btn btn-quiet" data-decide="" data-rid="${r.id}" data-eid="${eid}">Undo</button>` : `${statusWord('pending')} <button class="btn btn-secondary" data-decide="confirmed" data-rid="${r.id}" data-eid="${eid}">Approve</button><button class="btn btn-quiet" data-decide="rejected" data-rid="${r.id}" data-eid="${eid}">Reject</button>`}</div></div>`; }).join('')}
    </details>`; }).join('')}`;
}

function adminSuggestions() {
  onMount(() => $$('[data-sub]').forEach(b => b.onclick = () => {
    const s = SUBS.find(x => x.id === b.dataset.id); if (!s) return;
    s.status = b.dataset.sub; s.decidedAt = new Date().toISOString();
    logActivity(`${b.dataset.sub === 'pending' ? 'Reopened' : b.dataset.sub === 'approved' ? 'Approved' : 'Rejected'} suggestion “${s.title}”`);
    saveAll(); buildIndex(); render();
  }));
  if (!SUBS.length) return `<p class="lead">No suggestions yet. They arrive from the public <a href="${href('suggest')}">Suggest a resource</a> form.</p>`;
  return `<p class="lead">Check each link opens the institution's own record before approving. Approved suggestions appear in search.</p>
    ${SUBS.map(s => `<article class="panel sub">
      <div class="row-between"><h3>${h(s.title)}</h3>${statusWord(s.status)}</div>
      <p class="meta">${h(s.holder)} · ${h(s.dateText || 'Date not given')} · ${h(s.place || 'Place not given')} · sent ${new Date(s.at).toLocaleDateString()}${s.name ? ' by ' + h(s.name) : ''}</p>
      ${s.description ? `<p>${h(s.description)}</p>` : ''}
      <p>${ext(s.url, h(s.url))}</p>
      <div class="rev-act">${s.status === 'pending'
        ? `<button class="btn btn-primary" data-sub="approved" data-id="${s.id}">Approve</button><button class="btn btn-quiet" data-sub="rejected" data-id="${s.id}">Reject</button>`
        : `<button class="btn btn-quiet" data-sub="pending" data-id="${s.id}">Move back to pending</button>${s.status === 'approved' ? ` <a href="${href('r/sub-' + s.id)}">View in hub</a>` : ''}`}</div>
    </article>`).join('')}`;
}

function adminInstitutions() {
  const keys = Object.keys(INSTITUTIONS).filter(k => k !== 'csv');
  onMount(() => $$('form[data-inst]').forEach(f => f.onsubmit = e => {
    e.preventDefault();
    const k = f.dataset.inst, d = Object.fromEntries(new FormData(f));
    INST_EDITS[k] = { ...(INST_EDITS[k] || {}), ...d };
    logActivity(`Updated visitor details for ${INSTITUTIONS[k].name}`); saveAll(); buildIndex(); render();
  }));
  return `<p class="lead">Keep visitor details current. These appear on every record the institution holds.</p>
    ${keys.map(k => { const I = INSTITUTIONS[k]; return `<details class="rev"><summary><b>${h(I.name)}</b> <span class="meta">${plural(recsOf(k).length, 'record')}${INST_EDITS[k] ? ' · edited' : ''}</span></summary>
      <form class="form" data-inst="${k}">
        <label>Visitor address<input name="address" value="${h(I.address || '')}"></label>
        <label>Website<input name="web" type="url" value="${h(I.web || '')}"></label>
        <label>How to access<textarea name="access" rows="2">${h(I.access || '')}</textarea></label>
        <button class="btn btn-secondary">Save</button>
      </form></details>`; }).join('')}`;
}

desmond-8,Affidavit of Service to Henry MacNeil (dated 6 January 1947),7 January 1947,https://archives.novascotia.ca/desmond/archives/?ID=8,Nova Scotia Archives,Viola Desmond court file
desmond-9,Affidavit of Service to Stipendiary Magistrate MacKay and Henry MacNeil,7 January 1947,https://archives.novascotia.ca/desmond/archives/?ID=9,Nova Scotia Archives,Viola Desmond court file`;
const CSV_GUESS = { id: /^(id|identifier|record.?id|accession|ref.?no)$/i, title: /title|name|heading/i, dateText: /date|year|span/i, url: /url|link|uri|web/i, holder: /institution|holder|repository|owner|held/i, description: /desc|notes?|scope|summary|abstract/i, creator: /creator|author|photographer|maker/i, resourceType: /type|format|material/i, placeText: /place|location|community|town/i };
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function adminImport() {
  onMount(bindImporter);
  return `<p class="lead">Paste a spreadsheet export (CSV). The hub guesses which column is which and shows you before anything is added. Rows without a link to the original record are refused.</p>
    <p><button class="btn btn-secondary" id="csv-sample" type="button">Load a sample</button> <label class="btn btn-quiet">Choose a file<input type="file" id="csv-file" accept=".csv,text/csv" hidden></label></p>
    <label class="sr-only" for="csv-text">CSV text</label><textarea id="csv-text" class="mono" rows="7" placeholder="id,title,date,link,institution,notes"></textarea>
    <div id="csv-map"></div><div id="csv-preview"></div>
    ${IMPORTED.length ? `<p>${statusWord('approved')} ${plural(IMPORTED.length, 'record')} imported. <a href="${href('search', { provider: 'csv' })}">See them in search</a> · <button class="linklike" id="csv-clear">Remove imported records</button></p>` : ''}`;
}
function bindImporter() {
  const ta = $('#csv-text');
  $('#csv-sample').onclick = () => { ta.value = SAMPLE_CSV; preview(); };
  $('#csv-file').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { ta.value = t; preview(); }); };
  const clr = $('#csv-clear'); if (clr) clr.onclick = () => { IMPORTED = []; logActivity('Removed imported records'); saveAll(); buildIndex(); render(); };
  ta.oninput = preview;
  let mapping = {};
  function preview() {
    const rows = parseCsv(ta.value); if (rows.length < 2) { $('#csv-map').innerHTML = ''; $('#csv-preview').innerHTML = ''; return; }
    const head = rows[0];
    mapping = {};
    for (const [field, re] of Object.entries(CSV_GUESS)) { const i = head.findIndex(c => re.test(c.trim())); if (i >= 0 && !Object.values(mapping).includes(i)) mapping[field] = i; }
    $('#csv-map').innerHTML = `<h2 class="h3">Column mapping</h2><div class="mapgrid">${Object.keys(CSV_GUESS).map(f => `<label>${f}<select data-f="${f}"><option value="">None</option>${head.map((c, i) => `<option value="${i}" ${mapping[f] === i ? 'selected' : ''}>${h(c)}</option>`).join('')}</select></label>`).join('')}</div>`;
    $$('#csv-map select').forEach(s => s.onchange = () => { if (s.value === '') delete mapping[s.dataset.f]; else mapping[s.dataset.f] = +s.value; show(); });
    show();
    function show() {
      const recs = rows.slice(1).map((r, n) => csvToRecord(r, mapping, n));
      const ok = recs.filter(r => r.title && /^https?:\/\//.test(r.url)), bad = recs.length - ok.length;
      $('#csv-preview').innerHTML = `<h2 class="h3">Preview</h2>
        ${bad ? `<p class="notice notice-rejected">${plural(bad, 'row')} with no title or no link will be skipped.</p>` : ''}
        <table class="tbl"><thead><tr><th>Title</th><th>Date read as</th><th>Held by</th><th>Linked to</th></tr></thead><tbody>${ok.slice(0, 6).map(r => { const d = parseDate(r.dateText); const l = linkEntities(r).filter(x => x.status === 'confirmed'); return `<tr><td>${h(r.title)}</td><td>${h(r.dateText)} → ${d.start ?? 'none'}</td><td>${h(instName(r.holder))}</td><td>${l.map(x => h(nameOf(x.id))).join(', ') || 'Nothing yet'}</td></tr>`; }).join('')}</tbody></table>
        <button class="btn btn-primary" id="csv-go" ${ok.length ? '' : 'disabled'}>Add ${plural(ok.length, 'record')}</button>`;
      const g = $('#csv-go'); if (g) g.onclick = () => {
        const fresh = ok.filter(r => !REC.has(r.id));
        IMPORTED.push(...fresh); logActivity(`Imported ${plural(fresh.length, 'record')} from CSV`); saveAll(); buildIndex(); render();
      };
    }
  }
}
function csvToRecord(row, m, n) {
  const g = f => m[f] != null ? (row[m[f]] || '').trim() : '';
  const instText = g('holder');
  let holder = Object.keys(INSTITUTIONS).find(k => norm(INSTITUTIONS[k].name) === norm(instText));
  if (!holder) {
    holder = 'csv-' + (norm(instText).replace(/\W+/g, '-') || 'unknown');
    INST_EDITS[holder] = INST_EDITS[holder] || { name: instText || 'Unknown institution', kind: 'Added by CSV import', address: '', place: '', access: 'Visitor details not yet added.' };
    INSTITUTIONS[holder] = { ...INST_EDITS[holder] };
  }
  if (!INSTITUTIONS.csv) INSTITUTIONS.csv = { name: 'CSV import', kind: 'Imported source', access: 'Imported by a curator.' };
  return {
    id: 'csv-' + (g('id') || n), source: 'csv', sourceRecordId: g('id') || String(n),
    title: g('title'), description: g('description'), dateText: g('dateText'),
    resourceType: g('resourceType') || 'Record', resourceTypeRule: 'CSV column', holder, provider: 'csv', url: g('url'),
    reference: g('id'), creator: g('creator'), collection: 'CSV import', themeKey: 'csv:*', placesText: g('placeText'),
    access: { status: 'Catalogue online', note: 'Check the linked record for access.' }, image: '',
    native: Object.fromEntries(row.map((v, i) => [String(i), v])),
    provenance: [`Imported from CSV on ${new Date().toISOString().slice(0, 10)}.`, `Columns mapped: ${Object.entries(m).map(([k, i]) => k + ' ← column ' + (i + 1)).join(', ')}.`]
  };
}

function adminSources() {
  return `<p class="lead">Where the hub's records come from and how each source's fields map to the common record.</p>
    <table class="tbl"><thead><tr><th>Source</th><th>Format</th><th>Records</th><th>Harvested</th></tr></thead><tbody>
    ${Object.entries(SOURCES).map(([k, s]) => { const f = s.feed(); return `<tr><td>${h(s.label)}</td><td>${h(s.shape)}</td><td>${f.records.length}</td><td>${h(f.harvested)}</td></tr>`; }).join('')}
    ${IMPORTED.length ? `<tr><td>CSV import</td><td>Spreadsheet</td><td>${IMPORTED.length}</td><td>This browser</td></tr>` : ''}
    ${SUBS.some(s => s.status === 'approved') ? `<tr><td>Public suggestions</td><td>Form</td><td>${SUBS.filter(s => s.status === 'approved').length}</td><td>This browser</td></tr>` : ''}
    </tbody></table>
    ${Object.entries(SOURCES).map(([key, s]) => { const f = s.feed(); const sample = f.records[0]; const mapped = crosswalk[key](sample);
      return `<details class="rev"><summary><b>${h(s.label)}</b> <span class="meta">sample record and mapping</span></summary>
        <p class="meta">Harvested from ${f.harvestUrls.map((u, i) => ext(u, 'page ' + (i + 1))).join(', ')}</p>
        <div class="two even"><div><h2 class="h3">As published</h2><pre>${h(JSON.stringify(sample, null, 2))}</pre></div>
        <div><h2 class="h3">After mapping</h2><dl class="facts">${['id', 'title', 'dateText', 'resourceType', 'holder', 'provider', 'url', 'reference', 'collection'].map(k => `<dt>${k}</dt><dd>${h(mapped[k])}</dd>`).join('')}</dl></div></div>
      </details>`; }).join('')}`;
}

function adminData() {
  onMount(() => {
    $('#exp').onclick = () => {
      const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), CUR, IMPORTED, SUBS, INST_EDITS, ACTIVITY }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'connected-histories-admin-backup.json'; a.click(); URL.revokeObjectURL(a.href);
    };
    $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => {
      try { const d = JSON.parse(t); CUR = d.CUR || {}; IMPORTED = d.IMPORTED || []; SUBS = d.SUBS || []; INST_EDITS = d.INST_EDITS || {}; ACTIVITY = d.ACTIVITY || []; logActivity('Restored a backup'); saveAll(); buildIndex(); render(); }
      catch { alert('That file is not a Connected Histories backup.'); } }); };
    $('#reset').onclick = () => { if (!confirm('Remove all decisions, imports, suggestions and edits saved in this browser?')) return;
      CUR = {}; IMPORTED = []; SUBS = []; INST_EDITS = {}; ACTIVITY = []; for (const k of Object.keys(INSTITUTIONS)) if (!ORIGINAL_INST[k] && k !== 'community') delete INSTITUTIONS[k]; Object.assign(INSTITUTIONS, JSON.parse(JSON.stringify(ORIGINAL_INST))); saveAll(); buildIndex(); render(); };
  });
  return `<p class="lead">Admin changes live in this browser. Download a backup to move them to another computer.</p>
    <p><button class="btn btn-secondary" id="exp">Download backup</button> <label class="btn btn-quiet">Restore from a backup<input type="file" id="imp" accept="application/json" hidden></label></p>
    <p><button class="btn btn-quiet danger" id="reset">Reset everything saved in this browser</button></p>`;
}
